name: Release

# 打 tag 自动发版：git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file
        shell: pwsh
        run: ./publish.ps1

      - name: Extract version from tag
        shell: pwsh
        id: version
        run: |
          # 从 tag 提取版本（v0.1.2 → 0.1.2），并生成安装版文件名
          $tag = "${env:GITHUB_REF}" -replace '^refs/tags/', ''
          $ver = $tag.TrimStart('v')
          "version=$ver" >> $env:GITHUB_OUTPUT
          "setup_name=WinNetFix-Setup-$ver.exe" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag ver=$ver"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # 用官方 GitHub Releases 稳定地址下载并静默安装 Inno Setup 6
          $installer = Join-Path $env:TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 1000000) {
            throw "Inno Setup 下载失败或文件不完整"
          }
          Start-Process $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # 定位实际安装位置（管理员 runner 可能装到 Program Files，普通用户装到 LOCALAPPDATA）
          $c = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $c) { throw "ISCC.exe 未找到（安装失败）" }
          Get-Item $c | Select-Object FullName

      - name: Build Setup installer
        shell: pwsh
        run: |
          # 定位 ISCC.exe（兼容用户级与系统级安装）
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe 未找到" }
          Write-Host "ISCC: $iscc"
          & $iscc "./installer/WinNetFix.iss" "/DMyAppVersion=${{ steps.version.outputs.version }}"
          Get-ChildItem ./publish/WinNetFix-Setup-*.exe | Select-Object Name, Length

      - name: Generate SHA256
        shell: pwsh
        run: |
          $assets = @(
            "./publish/${{ steps.version.outputs.setup_name }}"
          )
          $lines = foreach ($f in $assets) {
            $hash = Get-FileHash -Algorithm SHA256 $f
            "$(Split-Path $f -Leaf)  $($hash.Hash)"
          }
          $lines | Set-Content ./publish/SHA256.txt
          Get-Content ./publish/SHA256.txt

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/WinNetFix-Setup-*.exe
            publish/SHA256.txt
          draft: true
          generate_release_notes: true
