name: Release

# 打 tag 自动发版：git tag vX.Y.Z && git push origin vX.Y.Z
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file
        shell: pwsh
        run: ./publish.ps1

      - name: Extract version from tag
        shell: pwsh
        id: version
        run: |
          # 从 tag 提取版本（v0.1.2 → 0.1.2），并生成带版本的文件名
          $tag = "${env:GITHUB_REF}" -replace '^refs/tags/', ''
          $ver = $tag.TrimStart('v')
          "version=$ver" >> $env:GITHUB_OUTPUT
          "asset_name=WinNetFix-$tag.exe" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag ver=$ver"

      - name: Rename exe with version
        shell: pwsh
        run: |
          $src = './publish/WinNetFix.exe'
          $dst = "./publish/${{ steps.version.outputs.asset_name }}"
          Rename-Item $src $dst -Force
          Get-Item $dst | Select-Object Name, Length

      - name: Generate SHA256
        shell: pwsh
        run: |
          $asset = "./publish/${{ steps.version.outputs.asset_name }}"
          $hash = Get-FileHash -Algorithm SHA256 $asset
          "${{ steps.version.outputs.asset_name }}  $($hash.Hash)" | Set-Content ./publish/SHA256.txt
          Get-Content ./publish/SHA256.txt

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/${{ steps.version.outputs.asset_name }}
            publish/SHA256.txt
          draft: true
          generate_release_notes: true
